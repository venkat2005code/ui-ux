<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura.</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/rtl.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='9' cy='12' r='7' fill='%234f46e5' fill-opacity='0.8'/><circle cx='15' cy='12' r='7' fill='%2314b8a6' fill-opacity='0.8'/></svg>">
    <style>
        body { margin: 0; padding: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-secondary); }
        .auth-container { width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-primary); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-lg); height: 650px; }
        .auth-form { padding: var(--space-8); display: flex; flex-direction: column; justify-content: center; }
        .auth-hero { background-color: var(--accent-color); padding: var(--space-8); color: white; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .brand-center { text-align: center; margin-bottom: var(--space-6); }
        .brand-center .nav-brand { font-size: 2rem; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: var(--space-2); width: 100%; margin-bottom: var(--space-3); border: 1px solid var(--border-color); background: var(--bg-primary); padding: var(--space-3); border-radius: var(--radius-md); font-weight: 500; cursor: pointer; transition: background-color var(--transition-fast); }
        .social-btn:hover { background-color: var(--bg-secondary); }
    </style>

    
    <!-- Dark Mode & Direction Initializer (Prevents FOUC & persists across all pages) -->
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
                const direction = localStorage.getItem('direction');
                if (direction === 'rtl') {
                    document.documentElement.dir = 'rtl';
                }
            } catch (e) {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                }
            }
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <div class="brand-center">
                <a href="index.html" class="nav-brand" style="display: flex; align-items: center; gap: 8px;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="9" cy="12" r="7" fill="var(--primary-color)" fill-opacity="0.8"/>
                    <circle cx="15" cy="12" r="7" fill="var(--accent-color)" fill-opacity="0.8"/>
                </svg>
                Aura<span>.</span>
            </a>
            </div>
            
            <form>
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">Sign Up</button>
            </form>
            
            <div style="text-align: center; margin: var(--space-4) 0; color: var(--text-light);">or sign up with</div>
            
            <button class="social-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#4285F4"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Google
            </button>
            
            <div style="text-align: center; margin-top: var(--space-4);">
                <p class="text-sm">Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </div>
        <div class="auth-hero">
            <h2 style="color: white; margin-bottom: var(--space-4);">Join the Community</h2>
            <p style="color: rgba(255,255,255,0.9);">Start designing better experiences today. Access premium resources, collaborate with peers, and elevate your design workflow.</p>
        </div>
    </div>
</body>
</html>
